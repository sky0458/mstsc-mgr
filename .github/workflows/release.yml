name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cargo package version not found" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build standard Windows release
        run: cargo build --release
      - name: Prepare patched GPUI for Server 2016
        shell: pwsh
        run: |
          cargo vendor --versioned-dirs vendor | Out-Null
          & .\compat\patch-gpui-legacy.ps1
          Add-Content Cargo.toml "`n[patch.crates-io]`ngpui = { path = 'vendor/gpui-0.2.2' }`n"
      - name: Build Server 2016 / Windows 10 1607 release
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = 'target-legacy'
          cargo build --release --features legacy-windows
      - name: Verify legacy compatibility contract
        shell: pwsh
        run: |
          $patchedDevices = Get-Content -Raw vendor\gpui-0.2.2\src\platform\windows\directx_devices.rs
          $patchedRenderer = Get-Content -Raw vendor\gpui-0.2.2\src\platform\windows\directx_renderer.rs
          $patchedDestination = Get-Content -Raw vendor\gpui-0.2.2\src\platform\windows\destination_list.rs
          if ($patchedDevices -match 'IDXGIFactory6' -or $patchedRenderer -match 'IDXGIFactory6') {
            throw 'legacy GPUI still requires IDXGIFactory6'
          }
          if ($patchedDevices -notmatch 'IDXGIFactory2' -or $patchedRenderer -notmatch 'IDXGIFactory2') {
            throw 'legacy GPUI IDXGIFactory2 patch is missing'
          }
          if ($patchedDestination -match 'u_strlen') {
            throw 'legacy GPUI still contains the Windows ICU u_strlen dependency'
          }
          $legacyImports = dumpbin /imports target-legacy\release\mstsc-mgr.exe | Out-String
          if ($legacyImports -match '(?im)\bicuuc\.dll\b') {
            throw 'legacy executable still imports icuuc.dll'
          }
      - name: Package Windows variants
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\standard,dist\legacy | Out-Null
          Copy-Item target\release\mstsc-mgr.exe dist\standard\mstsc-mgr.exe
          Copy-Item target-legacy\release\mstsc-mgr.exe dist\legacy\mstsc-mgr.exe
          foreach ($dir in @('dist\standard', 'dist\legacy')) {
            Copy-Item assets\mstsc-mgr.ico "$dir\mstsc-mgr.ico"
            Copy-Item README.md "$dir\README.md"
            Copy-Item LICENSE "$dir\LICENSE"
          }
          Compress-Archive -Path dist\standard\* -DestinationPath mstsc-mgr-windows-x64.zip
          Compress-Archive -Path dist\legacy\* -DestinationPath mstsc-mgr-windows-legacy-x64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: mstsc-mgr ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            mstsc-mgr-windows-x64.zip
            mstsc-mgr-windows-legacy-x64.zip
