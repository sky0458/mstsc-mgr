name: external-server2016-ci

on:
  push:
    branches:
      - external/server2016
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      - name: Verify legacy-safe imports
        shell: pwsh
        run: |
          $exe = "target\release\mstsc-mgr-external.exe"
          if (!(Test-Path $exe)) { throw "release executable missing" }
          $imports = (& dumpbin.exe /dependents $exe | Out-String)
          Write-Host $imports
          $forbidden = @("d3d11.dll", "dxgi.dll", "dcomp.dll", "icuuc.dll", "WebView2Loader.dll")
          foreach ($dll in $forbidden) {
            if ($imports -match [regex]::Escape($dll)) {
              throw "legacy build unexpectedly imports $dll"
            }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\mstsc-mgr-external.exe dist\
          Copy-Item README.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath mstsc-mgr-external-server2016-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mstsc-mgr-external-server2016-x64
          path: mstsc-mgr-external-server2016-x64.zip
          if-no-files-found: error
