name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cargo package version not found" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build release
        run: cargo build --release
      - name: Build Windows Server 2016 compatibility shim
        shell: pwsh
        run: |
          cl /nologo /LD /O2 /MT /GS- compat\icuuc_shim.c /link /NOLOGO /OUT:target\release\icuuc.dll
      - name: Verify legacy ICU compatibility contract
        shell: pwsh
        run: |
          $imports = dumpbin /imports:icuuc.dll target\release\mstsc-mgr.exe | Out-String
          if ($imports -notmatch '(?im)\bu_strlen\b') {
            throw "mstsc-mgr.exe no longer imports icuuc.dll!u_strlen; review the legacy compatibility package"
          }
          $exports = dumpbin /exports target\release\icuuc.dll | Out-String
          if ($exports -notmatch '(?im)\bu_strlen\b') {
            throw "legacy icuuc.dll does not export u_strlen"
          }
      - name: Package Windows variants
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\standard,dist\legacy | Out-Null
          foreach ($dir in @('dist\standard', 'dist\legacy')) {
            Copy-Item target\release\mstsc-mgr.exe "$dir\mstsc-mgr.exe"
            Copy-Item assets\mstsc-mgr.ico "$dir\mstsc-mgr.ico"
            Copy-Item README.md "$dir\README.md"
            Copy-Item LICENSE "$dir\LICENSE"
          }
          Copy-Item target\release\icuuc.dll dist\legacy\icuuc.dll
          Compress-Archive -Path dist\standard\* -DestinationPath mstsc-mgr-windows-x64.zip
          Compress-Archive -Path dist\legacy\* -DestinationPath mstsc-mgr-windows-legacy-x64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: mstsc-mgr ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            mstsc-mgr-windows-x64.zip
            mstsc-mgr-windows-legacy-x64.zip
