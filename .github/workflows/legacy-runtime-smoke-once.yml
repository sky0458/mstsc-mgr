name: Legacy runtime smoke (one-time, Server 2016)

on:
  push:
    branches:
      - fix/v0.2.12-rollback-floating-position
    paths:
      - '.github/workflows/legacy-runtime-smoke-once.yml'

permissions:
  actions: read
  contents: read

jobs:
  server2016-runtime-smoke:
    runs-on: [self-hosted, Windows, X64, server2016]
    timeout-minutes: 15
    steps:
      - name: Verify actual Windows Server 2016 interactive runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $sessionId = (Get-Process -Id $PID).SessionId

          @(
            "Caption=$($os.Caption)",
            "Version=$($os.Version)",
            "Build=$($cv.CurrentBuildNumber)",
            "DisplayVersion=$($cv.DisplayVersion)",
            "SessionId=$sessionId",
            "ComputerName=$env:COMPUTERNAME"
          ) | Set-Content -Path "$env:RUNNER_TEMP\server2016-os-info.txt" -Encoding UTF8

          Get-Content "$env:RUNNER_TEMP\server2016-os-info.txt"

          if ($os.Caption -notmatch 'Windows Server 2016') {
            throw "This one-time smoke test requires real Windows Server 2016, got: $($os.Caption)"
          }
          if ($os.Version -notlike '10.0.14393*' -or $cv.CurrentBuildNumber -ne '14393') {
            throw "This one-time smoke test requires Windows Server 2016 build 14393, got version=$($os.Version) build=$($cv.CurrentBuildNumber)"
          }
          if ($sessionId -eq 0) {
            throw 'The self-hosted runner is running in Session 0. Start the runner interactively with run.cmd from the logged-in desktop; do not run it as a Windows service for this GUI smoke test.'
          }

      - name: Download exact CI #205 legacy package
        uses: actions/download-artifact@v4
        with:
          name: mstsc-mgr-windows-legacy-x64
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32618504977

      - name: Extract exact release candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path artifact -Filter '*.zip' -File | Select-Object -First 1
          if (-not $zip) {
            throw 'Legacy package ZIP was not found in downloaded CI #205 artifact.'
          }
          New-Item -ItemType Directory -Force smoke-app | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath smoke-app -Force
          $exe = Get-ChildItem -Path smoke-app -Recurse -Filter 'mstsc-mgr.exe' -File | Select-Object -First 1
          if (-not $exe) {
            throw 'mstsc-mgr.exe was not found after extracting the legacy package.'
          }
          if (Get-ChildItem -Path $exe.Directory.FullName -Filter 'icuuc.dll' -File -ErrorAction SilentlyContinue) {
            throw 'Downloaded package is the obsolete ICU-shim legacy build, not the patched-GPUI CI #205 build.'
          }
          "EXE=$($exe.FullName)" | Set-Content -Path "$env:RUNNER_TEMP\legacy-exe-path.txt" -Encoding ASCII
          Write-Host "Testing exact legacy executable: $($exe.FullName)"

      - name: Launch on Server 2016 and verify GPUI runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exeLine = Get-Content "$env:RUNNER_TEMP\legacy-exe-path.txt" | Select-Object -First 1
          $exe = $exeLine.Substring(4)
          $workDir = Split-Path $exe
          $log = Join-Path $workDir 'mstsc-mgr.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class WindowProbe {
              public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int maxCount);

              public static string[] Titles(uint targetPid) {
                  var titles = new List<string>();
                  EnumWindows((hwnd, lParam) => {
                      uint pid;
                      GetWindowThreadProcessId(hwnd, out pid);
                      if (pid == targetPid) {
                          var text = new StringBuilder(512);
                          GetWindowText(hwnd, text, text.Capacity);
                          if (text.Length > 0) titles.Add(text.ToString());
                      }
                      return true;
                  }, IntPtr.Zero);
                  return titles.ToArray();
              }
          }
          '@

          $process = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          Write-Host "Started mstsc-mgr PID=$($process.Id) on Windows Server 2016 build 14393"

          $required = @('mstsc-mgr', 'mstsc-mgr-floating-ball', 'mstsc-mgr-floating-list')
          $deadline = (Get-Date).AddSeconds(30)
          $seen = @()

          try {
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                if (Test-Path $log) { Get-Content $log }
                throw "Legacy executable exited during startup with code $($process.ExitCode)"
              }

              $seen = @([WindowProbe]::Titles([uint32]$process.Id))
              Write-Host ("Top-level windows: " + ($seen -join ' | '))

              if ($seen -contains 'Failed to launch') {
                throw 'GPUI displayed Failed to launch on Windows Server 2016.'
              }

              $missing = @($required | Where-Object { $seen -notcontains $_ })
              if ($missing.Count -eq 0) {
                Write-Host 'Main window, floating ball and floating list HWNDs were all created.'
                break
              }
              Start-Sleep -Milliseconds 500
            }

            $missing = @($required | Where-Object { $seen -notcontains $_ })
            if ($missing.Count -ne 0) {
              if (Test-Path $log) { Get-Content $log }
              throw "Server 2016 startup timeout; missing windows: $($missing -join ', ')"
            }

            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Legacy executable exited after GPUI windows were created with code $($process.ExitCode)"
            }

            if (Test-Path $log) {
              Write-Host '--- mstsc-mgr.log ---'
              Get-Content $log
              $logText = Get-Content -Raw $log
              if ($logText -match '(?i)Creating DirectX devices|Failed to launch') {
                throw 'Runtime log contains a DirectX/GPUI startup failure marker.'
              }
            } else {
              Write-Warning 'mstsc-mgr.log was not created during Server 2016 smoke test.'
            }

            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("$env:RUNNER_TEMP\server2016-smoke.png", [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            Copy-Item "$env:RUNNER_TEMP\server2016-os-info.txt" "$workDir\server2016-os-info.txt" -Force
            if (Test-Path "$env:RUNNER_TEMP\server2016-smoke.png") {
              Copy-Item "$env:RUNNER_TEMP\server2016-smoke.png" "$workDir\server2016-smoke.png" -Force
            }

            Write-Host 'REAL WINDOWS SERVER 2016 RUNTIME SMOKE PASSED.'
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Server 2016 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server2016-runtime-smoke-evidence
          path: |
            smoke-app/**/mstsc-mgr.log
            smoke-app/**/server2016-os-info.txt
            smoke-app/**/server2016-smoke.png
          if-no-files-found: warn
